<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- token CSRF para quem precisar fazer fetch (mandar no header X-CSRF-TOKEN) -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <!-- usuario logado + sair -->
            <div class="d-flex justify-content-end align-items-center gap-2 mb-3" sec:authorize="isAuthenticated()">
                <span class="text-muted small">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                </span>
                <span class="badge bg-dark" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                <span class="badge bg-primary" sec:authorize="hasRole('GERENTE')">GERENTE</span>
                <span class="badge bg-info text-dark" sec:authorize="hasRole('ATENDENTE')">ATENDENTE</span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>

            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
