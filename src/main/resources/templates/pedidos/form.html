<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm" style="max-width: 800px;">
        <div class="card-body p-4">

            <form th:action="@{/pedidos/salvar}" method="post">

                <!-- Cliente -->
                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">
                        <i class="bi bi-person me-1"></i>Cliente
                    </label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="">Selecione o cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}"
                                th:text="${c.nome} + ' - ' + ${c.telefone}"></option>
                    </select>
                    <small class="text-muted" th:if="${#lists.isEmpty(clientes)}">
                        Nenhum cliente cadastrado ainda.
                    </small>
                </div>

                <!-- Entrega ou retirada -->
                <div class="mb-3">
                    <label class="form-label fw-medium d-block">
                        <i class="bi bi-truck me-1"></i>Tipo
                    </label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoEntrega1" value="ENTREGA" checked>
                        <label class="form-check-label" for="tipoEntrega1">Entrega</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoEntrega2" value="RETIRADA">
                        <label class="form-check-label" for="tipoEntrega2">Retirada no balcão</label>
                    </div>
                </div>

                <hr class="my-3"/>
                <p class="fw-medium mb-2"><i class="bi bi-list-ul me-1"></i>Itens (deixe 0 nos que não quiser)</p>

                <table class="table table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Preço</th>
                            <th style="width: 120px;">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="4" class="text-muted">Nenhum produto ativo cadastrado.</td>
                        </tr>
                        <tr th:each="p : ${produtos}">
                            <td th:text="${p.nome}"></td>
                            <td th:text="${p.tipo}"></td>
                            <td th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <input type="hidden" name="produtoIds" th:value="${p.id}">
                                <input type="number" name="quantidades" class="form-control form-control-sm"
                                       value="0" min="0" max="50">
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p class="small text-muted">O valor total é calculado pelo sistema com base no preço cadastrado de cada produto.</p>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Registrar Pedido
                    </button>
                    <a href="/pedidos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
