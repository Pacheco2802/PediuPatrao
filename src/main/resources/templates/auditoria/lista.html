<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <p class="small text-muted" sec:authorize="hasRole('ADMIN')">
        Para o perfil ADMIN os dados pessoais de clientes aparecem mascarados.
    </p>

    <!-- filtro -->
    <form th:action="@{/auditoria}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="entidadeId" class="form-control" placeholder="ID do pedido ou cliente"
                   th:value="${entidadeId}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
            <a href="/auditoria" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0 small">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Data e hora</th>
                        <th>Usuário</th>
                        <th>Perfil</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Campos alterados</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro de auditoria.
                        </td>
                    </tr>
                    <tr th:each="a : ${registros}">
                        <td class="ps-3 text-nowrap" th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td th:text="${a.usuario}"></td>
                        <td th:text="${a.perfil}"></td>
                        <td><span class="badge bg-secondary" th:text="${a.operacao}"></span></td>
                        <td>
                            <span th:text="${a.entidade}"></span><br>
                            <a class="text-muted" th:href="@{/auditoria(entidadeId=${a.entidadeId})}" th:text="${a.entidadeId}"></a>
                        </td>
                        <td>
                            <div th:each="c : ${a.campos}">
                                <strong th:text="${c.campo}"></strong>:
                                <span class="text-danger" th:text="${#strings.isEmpty(c.valorAnterior)} ? '(vazio)' : ${c.valorAnterior}"></span>
                                &rarr;
                                <span class="text-success" th:text="${#strings.isEmpty(c.valorNovo)} ? '(vazio)' : ${c.valorNovo}"></span>
                            </div>
                        </td>
                        <td th:text="${a.justificativa}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            Total: <strong th:text="${#lists.size(registros)}"></strong> registro(s)
        </div>
    </div>

</div>

</body>
</html>
