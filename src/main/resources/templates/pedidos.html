<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasAnyRole('ATENDENTE', 'GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Entrada</th>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Saída</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <span th:text="${pedido.dataHoraEntrada != null} ? ${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')} : '-'"></span>
                            <br><small class="text-muted" th:text="${pedido.usuarioEntrada}"></small>
                        </td>
                        <td th:text="${pedido.clienteNome != null} ? ${pedido.clienteNome} : ${pedido.clienteId}"></td>
                        <td th:text="${pedido.tipoEntrega}"></td>
                        <td th:text="${pedido.itens != null} ? ${#lists.size(pedido.itens)} : 0"></td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${pedido.status == 'PRONTO'} ? 'bg-info text-dark' :
                                                  (${pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'} ? 'bg-primary' : 'bg-secondary'))))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td>
                            <span th:text="${pedido.dataHoraSaida != null} ? ${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm')} : '-'"></span>
                            <br><small class="text-muted" th:text="${pedido.usuarioSaida}"></small>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Detalhes
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
